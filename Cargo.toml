[workspace]
members = [
  "crates/agent-runtime",
  "apps/desktop/src-tauri",
  "crates/ai-gateway",
  "crates/core-api",
  "crates/desktop-core",
  "crates/domain",
  "crates/ingestion",
  "crates/model-manager",
  "crates/retrieval",
  "crates/sidecar-supervisor",
  "crates/storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
a2a-client-lf = { version = "=0.2.1", default-features = false, features = ["rustls-tls"] }
a2a-lf = "=0.3.0"
a2a-server-lf = { version = "=0.4.1", default-features = false, features = ["rustls-tls"] }
anyhow = "1.0"
argon2 = "0.5.3"
async-stream = "0.3"
async-trait = "0.1.91"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1.10"
futures-util = "0.3"
fs2 = "0.4"
hf-hub = "1.0.0"
http = "1.3"
http-body-util = "0.1"
keyring = { version = "4.1.6", default-features = false, features = ["v1", "windows-native-keyring-store"] }
mime_guess = "2.0.5"
notify = "8.2.0"
pdf-extract = "0.12.0"
quick-xml = "0.41.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
rig-agent = { version = "=0.41.0", default-features = false }
rig-core = { version = "=0.41.0", default-features = false, features = ["reqwest", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "chrono",
  "json",
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
  "uuid",
] }
subtle = "2.6"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = [
  "fs",
  "macros",
  "net",
  "io-util",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
  "cors",
  "limit",
  "request-id",
  "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
turbovec = "0.9.0"
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }
walkdir = "2.5.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
